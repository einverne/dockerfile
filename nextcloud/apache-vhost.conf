<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	# cloudflared 到源站是明文 http，Apache 无从得知外部是 https，
	# .htaccess 里 .well-known/{caldav,carddav} 的 R=301 会写成 http://，
	# 把 DAV 客户端降级到明文。设 HTTPS=on 无效：ap_construct_url() 的
	# scheme 来自 mod_ssl 的 http_scheme hook，不看环境变量。
	#
	# 这里在 vhost 内直接输出绝对 https URL。vhost 属 server context，
	# 先于 per-dir(.htaccess) 规则执行，能覆盖掉那条相对 301。
	# 规则必须放在 vhost 里：主 server config 的 rewrite 指令默认不被
	# VirtualHost 继承。只在 X-Forwarded-Proto 为 https 时生效，
	# 局域网明文直连不受影响。
	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteCond %{HTTP:X-Forwarded-Proto} =https
		RewriteRule ^/\.well-known/(caldav|carddav)/?$ https://%{HTTP_HOST}/remote.php/dav/ [R=301,L]
	</IfModule>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
