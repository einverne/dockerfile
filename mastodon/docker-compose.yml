services:
  db:
    restart: always
    image: postgres:14-alpine
    shm_size: 256mb
    networks:
      - internal_network
      - mastodon_networks
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 15s
      retries: 12
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/einverne/mastodon/postgresql/data:/var/lib/postgresql/data
    env_file: .env.production
    environment:
      - "POSTGRES_DB=mastodon"
      - "POSTGRES_USER=mastodon"
      - "POSTGRES_PASSWORD=mastodon"
      - "POSTGRES_HOST_AUTH_METHOD=trust"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  redis:
    restart: always
    image: redis:7-alpine
    networks:
      - internal_network
      - mastodon_networks
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      retries: 12
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/einverne/mastodon/redis/data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  es:
    restart: always
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "cluster.name=es-mastodon"
      - "discovery.type=single-node"
      - "bootstrap.memory_lock=true"
    networks:
      - internal_network
      - mastodon_networks
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      retries: 12
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/einverne/mastodon/es/data:/usr/share/elasticsearch/data:rw
    ulimits:
      memlock:
        soft: -1
        hard: -1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  web:
    image: ghcr.io/mastodon/mastodon:${MASTODON_VERSION}
    restart: always
    env_file: .env.production
    environment:
      - "RAILS_ENV=production"
    command: bundle exec puma -C config/puma.rb
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
      interval: 15s
      retries: 12
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/einverne/mastodon/public/system:/mastodon/public/system
    networks:
      - internal_network
      - mastodon_networks
    ports:
      # nc1: host 3000 is taken by myaltbox; reached by gc3 NPM, filtered in DOCKER-USER
      - "3001:3000"
    depends_on:
      - db
      - redis

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:${MASTODON_VERSION}
    env_file: .env.production
    restart: always
    command: node ./streaming/index.js
    networks:
      - internal_network
      - mastodon_networks
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
      interval: 15s
      retries: 12
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - "NODE_ENV=production"
    ports:
      # reached by gc3 NPM (/api/v1/streaming), filtered in DOCKER-USER
      - "4000:4000"
    depends_on:
      - db
      - redis

  sidekiq:
    image: ghcr.io/mastodon/mastodon:${MASTODON_VERSION}
    environment:
      - "RAILS_ENV=production"
    env_file: .env.production
    restart: always
    command: bundle exec sidekiq
    networks:
      - internal_network
      - mastodon_networks
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/einverne/mastodon/public/system:/mastodon/public/system
    depends_on:
      - db
      - redis

networks:
  internal_network:
    internal: true
  mastodon_networks:
    external: true
